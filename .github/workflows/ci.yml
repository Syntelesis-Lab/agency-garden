name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or release tag to validate
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev,models,docs]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python scripts/check_release_files.py
      - run: mkdocs build --strict

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,models]'
      - run: python -m pytest --cov=agency_garden --cov-report=term-missing -W error::ResourceWarning

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_distribution.py dist/*.whl --sdist dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release-check:
    name: release-check
    if: always()
    needs: [quality, tests, distributions]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYCODE'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs and all(job['result'] == 'success' for job in jobs.values()), jobs
          PYCODE
